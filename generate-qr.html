<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate QR - Sistem Absensi Digital YAYASAN NURUL HUDA KAPEDI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="d-flex align-items-center gap-3">
                <div class="logo-container-sidebar">
                    <img src="assets/img/logo-yayasan.png" alt="Logo" class="sidebar-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="logo-fallback" style="display: none;">
                        <i class="bi bi-building"></i>
                    </div>
                </div>
                <div class="sidebar-title text-start text-white">
                    <h5 class="mb-0 fw-bold fs-6">E-ABSENSI</h5>
                    <small class="opacity-75" style="font-size: 10px;">YAYASAN NURUL HUDA</small>
                </div>
            </div>
            
            <div class="sidebar-user-card mt-4">
                <div class="user-avatar" id="adminAvatar">
                    <div class="avatar-text">A</div>
                </div>
                <div class="user-details text-start">
                    <h6 class="mb-0 text-white fw-bold" id="adminName">Admin</h6>
                    <small class="text-white opacity-75 fw-semibold" style="font-size: 10px;" id="adminRole">ADMIN</small>
                </div>
            </div>
        </div>
        <ul class="sidebar-menu">
            <li class="menu-item"><a href="dashboard.html"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a></li>
            <li class="menu-item"><a href="students.html"><i class="bi bi-people-fill"></i><span>Data Siswa</span></a></li>
            <li class="menu-item"><a href="import.html"><i class="bi bi-file-earmark-excel-fill"></i><span>Import Excel</span></a></li>
            <li class="menu-item"><a href="scan-qr.html"><i class="bi bi-upc-scan"></i><span>Scan QR</span></a></li>
            <li class="menu-item"><a href="attendance.html"><i class="bi bi-clipboard-check-fill"></i><span>Data Absensi</span></a></li>
            <li class="menu-item"><a href="reports.html"><i class="bi bi-file-earmark-text-fill"></i><span>Laporan</span></a></li>
            <li class="menu-item"><a href="settings.html"><i class="bi bi-gear-fill"></i><span>Setting</span></a></li>
            <li class="menu-item"><a href="admin.html"><i class="bi bi-person-gear"></i><span>Admin</span></a></li>
            <li class="menu-item"><a href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a></li>
        </ul>
    </div>

    <div class="main-content">
        <header class="top-header">
            <div class="header-left">
                <button class="btn-toggle-sidebar" id="toggleSidebar"><i class="bi bi-list"></i></button>
                <div class="header-title"><h4>Generate QR Code</h4></div>
            </div>
        </header>

        <div class="container-fluid">
            <div class="row">
                <div class="col-lg-4">
                    <div class="card premium-card">
                        <div class="card-body">
                            <h5 class="card-title mb-4">Pilih Siswa</h5>
                            <div class="input-group mb-3">
                                <span class="input-group-text"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control" id="searchStudent" placeholder="Cari siswa...">
                            </div>
                            <div id="studentList" style="max-height: 500px; overflow-y: auto;">
                                <p class="text-center text-muted">Loading...</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-lg-8">
                    <div class="card premium-card">
                        <div class="card-body text-center">
                            <h5 class="card-title mb-4">QR Code</h5>
                            
                            <div id="qrPlaceholder" class="qr-placeholder">
                                <i class="bi bi-qr-code"></i>
                                <p>Pilih siswa untuk generate QR Code</p>
                            </div>
                            
                            <div id="qrContainer" style="display:none;">
                                <div class="student-info-card mb-4">
                                    <h4 id="qrStudentName">-</h4>
                                    <p class="text-muted mb-1">NISN: <span id="qrStudentNISN">-</span></p>
                                    <p class="text-muted">Kelas: <span id="qrStudentClass">-</span></p>
                                </div>
                                
                                <div id="qrcode" class="qr-code-display"></div>
                                
                                <div class="btn-group mt-4" role="group">
                                    <button class="btn btn-primary" id="btnDownloadQR">
                                        <i class="bi bi-download"></i> Download PNG
                                    </button>
                                    <button class="btn btn-secondary" id="btnPrintQR">
                                        <i class="bi bi-printer"></i> Print
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="assets/js/firebase.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/qrcode.js"></script>
</body>
</html>
