<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Sistem Absensi Digital YAYASAN NURUL HUDA KAPEDI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="d-flex align-items-center gap-3">
                <div class="logo-container-sidebar">
                    <img src="assets/img/logo-yayasan.png" alt="Logo" class="sidebar-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="logo-fallback" style="display: none;">
                        <i class="bi bi-building"></i>
                    </div>
                </div>
                <div class="sidebar-title text-start text-white">
                    <h5 class="mb-0 fw-bold fs-6">E-ABSENSI</h5>
                    <small class="opacity-75" style="font-size: 10px;">YAYASAN NURUL HUDA</small>
                </div>
            </div>
            
            <div class="sidebar-user-card mt-4">
                <div class="user-avatar" id="adminAvatar">
                    <div class="avatar-text">A</div>
                </div>
                <div class="user-details text-start">
                    <h6 class="mb-0 text-white fw-bold" id="adminName">Admin</h6>
                    <small class="text-white opacity-75 fw-semibold" style="font-size: 10px;" id="adminRole">ADMIN</small>
                </div>
            </div>
        </div>
        <ul class="sidebar-menu">
            <li class="menu-item"><a href="dashboard.html"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a></li>
            <li class="menu-item"><a href="students.html"><i class="bi bi-people-fill"></i><span>Data Siswa</span></a></li>
            <li class="menu-item"><a href="import.html"><i class="bi bi-file-earmark-excel-fill"></i><span>Import Excel</span></a></li>
            <li class="menu-item"><a href="scan-qr.html"><i class="bi bi-upc-scan"></i><span>Scan QR</span></a></li>
            <li class="menu-item"><a href="attendance.html"><i class="bi bi-clipboard-check-fill"></i><span>Data Absensi</span></a></li>
            <li class="menu-item"><a href="reports.html"><i class="bi bi-file-earmark-text-fill"></i><span>Laporan</span></a></li>
            <li class="menu-item active"><a href="settings.html"><i class="bi bi-gear-fill"></i><span>Setting</span></a></li>
            <li class="menu-item"><a href="admin.html"><i class="bi bi-person-gear"></i><span>Admin</span></a></li>
            <li class="menu-item"><a href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a></li>
        </ul>
    </div>

    <div class="main-content">
        <header class="top-header">
            <div class="header-left">
                <button class="btn-toggle-sidebar" id="toggleSidebar"><i class="bi bi-list"></i></button>
                <div class="header-title"><h4>Pengaturan Sistem</h4></div>
            </div>
        </header>

        <div class="container-fluid">
            <div class="row">
                <div class="col-lg-6">
                    <div class="card premium-card mb-4">
                        <div class="card-body">
                            <h5 class="card-title mb-4"><i class="bi bi-building"></i> Informasi Sekolah</h5>
                            <form id="schoolForm">
                                <div class="mb-3">
                                    <label class="form-label">Nama Sekolah</label>
                                    <input type="text" class="form-control" id="schoolName">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Alamat Sekolah</label>
                                    <textarea class="form-control" id="schoolAddress" rows="3"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i> Simpan
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
                
                <div class="col-lg-6">
                    <div class="card premium-card mb-4">
                        <div class="card-body">
                            <h5 class="card-title mb-4"><i class="bi bi-clock"></i> Pengaturan Waktu Absensi</h5>
                            <form id="timeSettingsForm">
                                <h6 class="mb-3">Absen Masuk</h6>
                                <div class="row mb-3">
                                    <div class="col-6">
                                        <label class="form-label">Jam Mulai</label>
                                        <input type="time" class="form-control" id="jamMasukStart" value="06:00">
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label">Jam Terakhir (Batas Terlambat)</label>
                                        <input type="time" class="form-control" id="jamMasukEnd" value="07:30">
                                    </div>
                                </div>
                                
                                <h6 class="mb-3">Absen Pulang</h6>
                                <div class="row mb-3">
                                    <div class="col-6">
                                        <label class="form-label">Jam Mulai</label>
                                        <input type="time" class="form-control" id="jamPulangStart" value="14:00">
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label">Jam Terakhir</label>
                                        <input type="time" class="form-control" id="jamPulangEnd" value="16:00">
                                    </div>
                                </div>
                                
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i> Simpan Waktu
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>
    <script src="assets/js/firebase.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/global-scanner.js"></script>
    <script src="assets/js/setting.js"></script>
</body>
</html>
