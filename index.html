<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Digital YAYASAN NURUL HUDA KAPEDI - Login</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Google Fonts - Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-page">
    <div class="login-split-container">
        <!-- Left Pane (Branding & Image) -->
        <div class="login-left-pane">
            <div class="login-left-overlay"></div>
            
            <div class="login-brand-top">
                <img src="assets/img/logo-yayasan.png" alt="Logo" class="logo-small">
                <span>YAYASAN NURUL HUDA KAPEDI</span>
            </div>
            
            <div class="login-left-content">
                <h1 class="display-title">Sistem<br>Absensi<br>Digital</h1>
                <p class="display-subtitle">Sistem digital untuk pencatatan dan<br>pemantauan kehadiran siswa.</p>
                <div class="login-badges">
                    <span class="badge-version">v2.1</span>
                    <span class="badge-secure"><i class="bi bi-shield-check"></i> Secure Login</span>
                </div>
            </div>
        </div>

        <!-- Right Pane (Form) -->
        <div class="login-right-pane">
            <div class="login-form-container">
                <div class="login-header text-center mb-4">
                    <h2>Selamat Datang Kembali</h2>
                    <p class="text-muted">Silakan masuk ke akun Anda</p>
                </div>
                
                <form id="loginForm" class="login-form">
                    <div class="form-group mb-3">
                        <label for="email" class="form-label text-uppercase text-muted fw-bold" style="font-size: 11px; letter-spacing: 1px;">EMAIL ADMIN / GURU</label>
                        <div class="input-group-modern">
                            <i class="bi bi-envelope icon-left"></i>
                            <input type="email" class="form-control form-control-modern" id="email" placeholder="Masukkan Email Anda" required>
                        </div>
                    </div>
                    
                    <div class="form-group mb-4">
                        <label for="password" class="form-label text-uppercase text-muted fw-bold" style="font-size: 11px; letter-spacing: 1px;">PASSWORD</label>
                        <div class="input-group-modern password-group">
                            <i class="bi bi-lock icon-left"></i>
                            <input type="password" class="form-control form-control-modern" id="password" placeholder="••••••••" required>
                            <button type="button" class="btn-toggle-password-modern" id="togglePassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-login-modern w-100">
                        MASUK SEKARANG <i class="bi bi-arrow-right"></i>
                    </button>
                </form>
                
                <div class="login-footer mt-5 text-center text-muted">
                    <small>&copy; 2024 Sistem Absensi Digital YAYASAN NURUL HUDA KAPEDI</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>
    
    <!-- Custom Scripts -->
    <script src="assets/js/firebase.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/auth.js"></script>
    
    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('bi-eye-fill');
                icon.classList.add('bi-eye-slash-fill');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('bi-eye-slash-fill');
                icon.classList.add('bi-eye-fill');
            }
        });
    </script>
</body>
</html>
